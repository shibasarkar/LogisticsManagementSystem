version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: logistics_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=SecurePassword123!
      - POSTGRES_DB=LogisticsDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
